<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Pro Agent — Zombie Fire Survival</title>
    <style>
        body, html { 
            margin: 0; padding: 0; 
            overflow: hidden; 
            background-color: #111; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            user-select: none; 
            cursor: none; /* Hide default cursor to use custom crosshair */
        }
        canvas { display: block; }
        
        #ui { 
            position: absolute; top: 15px; left: 20px; 
            color: white; font-size: 24px; font-weight: bold;
            text-shadow: 2px 2px 0 #000; pointer-events: none; 
        }
        
        #healthBarContainer { 
            width: 250px; height: 25px; 
            background: #333; border: 3px solid #fff; 
            margin-top: 8px; border-radius: 4px; overflow: hidden;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        
        #healthBar { 
            width: 100%; height: 100%; 
            background: #2ecc71; 
            transition: width 0.1s, background-color 0.2s; 
        }
        
        #gameOverScreen { 
            display: none; position: absolute; top: 0; left: 0; 
            width: 100%; height: 100%; background: rgba(0,0,0,0.85); 
            color: #fff; flex-direction: column; align-items: center; 
            justify-content: center; z-index: 10; cursor: default;
        }
        
        #gameOverScreen h1 { 
            font-size: 80px; color: #ff3333; margin: 0 0 10px 0; 
            text-shadow: 0 0 30px #ff0000; letter-spacing: 5px;
        }
        
        #gameOverScreen p { font-size: 32px; margin: 0 0 50px 0; color: #ccc; }
        
        button { 
            padding: 15px 40px; font-size: 28px; font-weight: bold;
            background: #ff5500; color: white; border: none; 
            border-radius: 8px; cursor: pointer; 
            box-shadow: 0 6px 0 #aa3300; transition: all 0.1s; 
        }
        
        button:hover { background: #ff7733; }
        button:active { transform: translateY(6px); box-shadow: none; }
        
        #instructions { 
            position: absolute; bottom: 20px; right: 25px; 
            color: rgba(255,255,255,0.4); font-size: 18px; 
            text-align: right; pointer-events: none; 
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div id="ui">
        <div>Zombies Burned: <span id="scoreDisplay" style="color: #ff7733;">0</span></div>
        <div id="healthBarContainer"><div id="healthBar"></div></div>
    </div>
    
    <div id="instructions">
        <strong>WASD / Arrows</strong> to Move<br>
        <strong>Mouse</strong> to Aim<br>
        <strong>Left Click (Hold)</strong> to unleash fire
    </div>

    <div id="gameOverScreen">
        <h1>YOU DIED</h1>
        <p>Final Score: <span id="finalScore" style="color: #ff7733; font-weight: bold;">0</span></p>
        <button onclick="resetGame()">BURN MORE ZOMBIES</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false }); // Optimize for no transparency on base canvas
        const scoreDisplay = document.getElementById('scoreDisplay');
        const healthBar = document.getElementById('healthBar');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const finalScore = document.getElementById('finalScore');

        let width, height;
        let animationId;
        let isGameOver = false;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Game State Variables
        let player, zombies, flames, particles, score, spawnRate, spawnTimer;

        // Input Handling
        const keys = { w: false, a: false, s: false, d: false, ArrowUp: false, ArrowLeft: false, ArrowDown: false, ArrowRight: false };
        const mouse = { x: width/2, y: height/2, down: false };

        window.addEventListener('keydown', e => { if(keys.hasOwnProperty(e.key)) keys[e.key] = true; });
        window.addEventListener('keyup', e => { if(keys.hasOwnProperty(e.key)) keys[e.key] = false; });
        window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
        window.addEventListener('mousedown', e => { if(e.button === 0) mouse.down = true; });
        window.addEventListener('mouseup', e => { if(e.button === 0) mouse.down = false; });
        window.addEventListener('contextmenu', e => e.preventDefault());

        class Player {
            constructor() {
                this.x = width / 2;
                this.y = height / 2;
                this.radius = 16;
                this.speed = 4.5;
                this.health = 100;
                this.maxHealth = 100;
                this.color = '#3498db';
                this.heat = 0; // for dynamic glowing when shooting
            }
            
            update() {
                let dx = 0, dy = 0;
                if (keys.w || keys.ArrowUp) dy -= 1;
                if (keys.s || keys.ArrowDown) dy += 1;
                if (keys.a || keys.ArrowLeft) dx -= 1;
                if (keys.d || keys.ArrowRight) dx += 1;
                
                // Normalize diagonal movement to prevent moving faster diagonally
                if (dx !== 0 && dy !== 0) {
                    const length = Math.sqrt(dx*dx + dy*dy);
                    dx /= length;
                    dy /= length;
                }
                
                this.x += dx * this.speed;
                this.y += dy * this.speed;

                // Restrict player inside screen bounds
                this.x = Math.max(this.radius, Math.min(width - this.radius, this.x));
                this.y = Math.max(this.radius, Math.min(height - this.radius, this.y));

                if (mouse.down) {
                    this.heat = Math.min(1, this.heat + 0.05);
                } else {
                    this.heat = Math.max(0, this.heat - 0.02);
                }
            }
            
            draw() {
                // Glow effect based on how much fire is being shot
                if (this.heat > 0) {
                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius + 15, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 100, 0, ${this.heat * 0.3})`;
                    ctx.fill();
                    ctx.restore();
                }

                // Player Body
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#2980b9';
                ctx.stroke();

                // Turret / Aiming direction
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                const angle = Math.atan2(mouse.y - this.y, mouse.x - this.x);
                ctx.lineTo(this.x + Math.cos(angle) * 25, this.y + Math.sin(angle) * 25);
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 4;
                ctx.lineCap = 'round';
                ctx.stroke();
            }
            
            takeDamage(amount) {
                this.health -= amount;
                
                // Update Health Bar UX
                const hpPercent = Math.max(0, (this.health / this.maxHealth) * 100);
                healthBar.style.width = hpPercent + '%';
                
                if (hpPercent > 50) healthBar.style.background = '#2ecc71';
                else if (hpPercent > 20) healthBar.style.background = '#f1c40f';
                else healthBar.style.background = '#e74c3c';
                
                // Screen shake & red flash
                ctx.fillStyle = 'rgba(255, 0, 0, 0.4)';
                ctx.fillRect(0, 0, width, height);
                
                // Death check
                if (this.health <= 0) {
                    endGame();
                }
            }
        }

        class Zombie {
            constructor() {
                // Size variation
                this.radius = Math.random() * 12 + 12; // 12 to 24 size
                
                // Speed is inversely proportional to size
                this.speed = (30 / this.radius) * (0.8 + Math.random() * 0.4); 
                
                this.health = this.radius * 2;
                this.damage = this.radius * 0.8;
                
                // Spawn slightly outside the screen edge randomly
                const spawnEdge = Math.floor(Math.random() * 4);
                if (spawnEdge === 0) { this.x = Math.random() * width; this.y = -this.radius; }       // Top
                else if (spawnEdge === 1) { this.x = width + this.radius; this.y = Math.random() * height; } // Right
                else if (spawnEdge === 2) { this.x = Math.random() * width; this.y = height + this.radius; } // Bottom
                else { this.x = -this.radius; this.y = Math.random() * height; }                        // Left
                
                this.baseColor = [46, 204, 113]; // RGB for #2ecc71
                this.color = `rgb(${this.baseColor[0]}, ${this.baseColor[1]}, ${this.baseColor[2]})`;
                this.onFire = 0;
            }
            
            update() {
                const angle = Math.atan2(player.y - this.y, player.x - this.x);
                
                // Slow down when burning
                const currentSpeed = this.onFire > 0 ? this.speed * 0.4 : this.speed;
                
                this.x += Math.cos(angle) * currentSpeed;
                this.y += Math.sin(angle) * currentSpeed;
                
                if (this.onFire > 0) {
                    this.onFire--;
                    this.health -= 0.6; // Burn damage over time
                    
                    // Charred color blending
                    this.color = `rgb(${Math.min(255, this.baseColor[0]+150)}, ${this.baseColor[1]*0.5}, ${this.baseColor[2]*0.2})`;

                    // Emit smoke randomly
                    if (Math.random() < 0.3) {
                        particles.push(new Particle(this.x + (Math.random()-0.5)*this.radius, this.y + (Math.random()-0.5)*this.radius, '#555', 0, -1, 2));
                    }
                }
            }
            
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = this.onFire > 0 ? '#ff5500' : '#27ae60';
                ctx.stroke();
            }
        }

        class Flame {
            constructor(x, y, angle) {
                this.x = x;
                this.y = y;
                
                // Spread for flamethrower cone effect
                const spread = (Math.random() - 0.5) * 0.5;
                const speed = Math.random() * 6 + 7;
                
                this.vx = Math.cos(angle + spread) * speed;
                this.vy = Math.sin(angle + spread) * speed;
                
                this.radius = Math.random() * 12 + 6;
                this.life = 1.0;
                this.decay = Math.random() * 0.015 + 0.015;
                
                const colors = ['#ffff00', '#ffcc00', '#ff6600', '#ff3300', '#e74c3c'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
            }
            
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= this.decay;
                this.radius += 0.3; // Fire expands as it dissipates
                
                // Friction
                this.vx *= 0.96;
                this.vy *= 0.96;
            }
            
            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.globalCompositeOperation = 'lighter'; // Makes fire look glowing and intense
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.restore();
            }
        }

        class Particle {
            constructor(x, y, color, vx, vy, lifeMultiplier = 1) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.vx = vx + (Math.random() - 0.5) * 4;
                this.vy = vy + (Math.random() - 0.5) * 4;
                this.life = 1.0;
                this.decay = (Math.random() * 0.04 + 0.02) / lifeMultiplier;
                this.radius = Math.random() * 4 + 1;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= this.decay;
                // Add tiny friction
                this.vx *= 0.98;
                this.vy *= 0.98;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.restore();
            }
        }

        function createExplosion(x, y, color, count, multiplier = 1) {
            for (let i = 0; i < count; i++) {
                particles.push(new Particle(x, y, color, (Math.random()-0.5)*4, (Math.random()-0.5)*4, multiplier));
            }
        }

        function resetGame() {
            player = new Player();
            zombies = [];
            flames = [];
            particles = [];
            score = 0;
            spawnRate = 80;
            spawnTimer = 0;
            isGameOver = false;
            
            scoreDisplay.innerText = score;
            healthBar.style.width = '100%';
            healthBar.style.background = '#2ecc71';
            gameOverScreen.style.display = 'none';
            document.body.style.cursor = 'none'; // Re-hide cursor
            
            if(animationId) cancelAnimationFrame(animationId);
            gameLoop();
        }

        function endGame() {
            isGameOver = true;
            document.body.style.cursor = 'default';
            gameOverScreen.style.display = 'flex';
            finalScore.innerText = score;
        }

        function gameLoop() {
            if (isGameOver) return;
            
            // Solid dark background, no trailing (better performance)
            ctx.fillStyle = '#111';
            ctx.fillRect(0, 0, width, height);

            // Draw a subtle grid to give a sense of ground/motion
            ctx.strokeStyle = '#1a1a1a';
            ctx.lineWidth = 1;
            ctx.beginPath();
            for(let i=0; i<width; i+=100) { ctx.moveTo(i, 0); ctx.lineTo(i, height); }
            for(let i=0; i<height; i+=100) { ctx.moveTo(0, i); ctx.lineTo(width, i); }
            ctx.stroke();

            // Zombie Spawning Logic
            spawnTimer++;
            if (spawnTimer >= spawnRate) {
                zombies.push(new Zombie());
                spawnTimer = 0;
                // Ramp up difficulty
                if (spawnRate > 15) spawnRate -= 0.5;
            }

            // Shoot Flamethrower
            if (mouse.down) {
                const angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
                // 3 flames per frame for a continuous satisfying stream
                for(let i=0; i<3; i++) {
                    flames.push(new Flame(player.x, player.y, angle));
                }
                
                // Recoil / camera shake effect occasionally
                if (Math.random() < 0.2) {
                    ctx.translate((Math.random()-0.5)*2, (Math.random()-0.5)*2);
                }
            }

            // Update & Draw Entities
            player.update();
            player.draw();

            // Flames
            for (let i = flames.length - 1; i >= 0; i--) {
                const f = flames[i];
                f.update();
                f.draw();
                if (f.life <= 0) flames.splice(i, 1);
            }

            // Particles (Explosions/Smoke)
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.update();
                p.draw();
                if (p.life <= 0) particles.splice(i, 1);
            }

            // Zombies & Collisions
            for (let i = zombies.length - 1; i >= 0; i--) {
                const z = zombies[i];
                z.update();
                z.draw();

                // Player Hit Collision
                const distToPlayer = Math.hypot(player.x - z.x, player.y - z.y);
                if (distToPlayer < player.radius + z.radius) {
                    player.takeDamage(z.damage);
                    createExplosion(z.x, z.y, z.color, 15); // blood
                    zombies.splice(i, 1);
                    continue; // Zombie destroyed on impact
                }

                // Flame Hit Collision (optimised rough bounding box check first, then circle distance)
                for (let j = flames.length - 1; j >= 0; j--) {
                    const f = flames[j];
                    if (Math.abs(f.x - z.x) < z.radius + f.radius && Math.abs(f.y - z.y) < z.radius + f.radius) {
                        const distToFlame = Math.hypot(f.x - z.x, f.y - z.y);
                        if (distToFlame < z.radius + f.radius * 0.8) {
                            
                            z.health -= 2.5; // Direct flame damage
                            z.onFire = 90;   // Set on fire for 90 frames (~1.5s)
                            
                            // Visual hit spark
                            particles.push(new Particle(f.x, f.y, '#ffaa00', 0, 0, 0.5));
                            
                            // Absorb flame on hit (pierce occasionally depending on random)
                            if(Math.random() < 0.7) flames.splice(j, 1); 
                            
                            // Zombie death check
                            if (z.health <= 0) {
                                score += Math.floor(z.radius);
                                scoreDisplay.innerText = score;
                                
                                // Fiery guts explosion
                                createExplosion(z.x, z.y, '#ff5500', 10, 1.5); 
                                createExplosion(z.x, z.y, z.color, 10, 1);   
                                
                                zombies.splice(i, 1);
                                break; // Stop checking flames for this zombie
                            }
                        }
                    }
                }
            }

            // Custom UI Crosshair
            ctx.setTransform(1, 0, 0, 1, 0, 0); // Reset transform in case of shake
            ctx.beginPath();
            ctx.arc(mouse.x, mouse.y, 12, 0, Math.PI*2);
            ctx.strokeStyle = mouse.down ? '#ff3300' : 'rgba(255,255,255,0.7)';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            ctx.beginPath();
            ctx.moveTo(mouse.x - 20, mouse.y); ctx.lineTo(mouse.x - 5, mouse.y);
            ctx.moveTo(mouse.x + 5, mouse.y); ctx.lineTo(mouse.x + 20, mouse.y);
            ctx.moveTo(mouse.x, mouse.y - 20); ctx.lineTo(mouse.x, mouse.y - 5);
            ctx.moveTo(mouse.x, mouse.y + 5); ctx.lineTo(mouse.x, mouse.y + 20);
            ctx.stroke();

            // Next Frame
            animationId = requestAnimationFrame(gameLoop);
        }

        // Initialize!
        resetGame();
    </script>
</body>
</html>
