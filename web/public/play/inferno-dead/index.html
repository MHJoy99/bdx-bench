<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no" />
<title>DeepSeek V4.1 Flash — INFERNO DEAD</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#0a0b0e;}
  body{font-family:"Segoe UI",system-ui,-apple-system,sans-serif;}
  canvas{display:block;width:100vw;height:100vh;cursor:none;touch-action:none;background:#0a0b0e;}
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(function(){
'use strict';

/* ============================================================
   INFERNO DEAD — a top-down zombie burn-'em-up
   Everything is generated at runtime: no assets, no libraries.
   ============================================================ */

// ---------- tiny helpers ----------
var TAU = Math.PI*2;
var FONT = '"Arial Black","Arial Bold",Arial,sans-serif';
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function rand(a,b){ return a+Math.random()*(b-a); }
function randi(a,b){ return Math.floor(rand(a,b+1)); }
function lerp(a,b,t){ return a+(b-a)*t; }
function hypot(x,y){ return Math.sqrt(x*x+y*y); }
function angleLerp(a,b,t){ var d=((b-a+Math.PI)%TAU+TAU)%TAU-Math.PI; return a+d*t; }
function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

// ---------- canvas ----------
var canvas = document.getElementById('game');
var ctx = canvas.getContext('2d');
var W = 0, H = 0, DPR = 1;
var ground = null;

function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.max(1,Math.floor(W*DPR));
  canvas.height = Math.max(1,Math.floor(H*DPR));
  canvas.style.width = W+'px';
  canvas.style.height = H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  buildGround();
}

function splat(g,x,y,r){
  g.fillStyle = 'rgba(74,14,12,0.34)';
  g.beginPath();
  g.ellipse(x,y,r,r*rand(0.7,1.1),Math.random()*TAU,0,TAU);
  g.fill();
  for(var i=0;i<7;i++){
    var a = Math.random()*TAU, d = r*rand(1.2,2.6);
    g.beginPath();
    g.arc(x+Math.cos(a)*d, y+Math.sin(a)*d, rand(0.8,3.0), 0, TAU);
    g.fill();
  }
}

function buildGround(){
  ground = document.createElement('canvas');
  ground.width = Math.max(1,Math.floor(W*DPR));
  ground.height = Math.max(1,Math.floor(H*DPR));
  var g = ground.getContext('2d');
  g.setTransform(DPR,0,0,DPR,0,0);

  g.fillStyle = '#0f1116';
  g.fillRect(0,0,W,H);

  // asphalt mottling
  var i, x, y, r, rg;
  for(i=0;i<Math.min(420, W*H/4200);i++){
    x = Math.random()*W; y = Math.random()*H; r = rand(50,220);
    rg = g.createRadialGradient(x,y,0,x,y,r);
    var light = Math.random()<0.5;
    rg.addColorStop(0, light ? 'rgba(255,255,255,'+rand(0.006,0.022)+')' : 'rgba(0,0,0,'+rand(0.03,0.09)+')');
    rg.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle = rg;
    g.beginPath(); g.arc(x,y,r,0,TAU); g.fill();
  }

  // fine speckles
  for(i=0;i<Math.min(2600, W*H/950);i++){
    g.fillStyle = 'rgba(255,255,255,'+rand(0.008,0.03)+')';
    g.fillRect(Math.random()*W, Math.random()*H, rand(1,2), rand(1,2));
  }

  // cracks
  g.strokeStyle = 'rgba(0,0,0,0.32)';
  for(i=0;i<34;i++){
    x = Math.random()*W; y = Math.random()*H;
    g.lineWidth = rand(0.6,1.8);
    g.beginPath(); g.moveTo(x,y);
    var segs = randi(3,7);
    for(var s=0;s<segs;s++){
      x += rand(-46,46); y += rand(-34,34);
      g.lineTo(x,y);
    }
    g.stroke();
  }

  // old blood
  for(i=0;i<12;i++) splat(g, Math.random()*W, Math.random()*H, rand(10,34));

  // vignette
  var vg = g.createRadialGradient(W/2,H/2,Math.min(W,H)*0.32, W/2,H/2,Math.max(W,H)*0.78);
  vg.addColorStop(0,'rgba(0,0,0,0)');
  vg.addColorStop(1,'rgba(0,0,0,0.7)');
  g.fillStyle = vg;
  g.fillRect(0,0,W,H);
}

// ---------- sprite factory (soft radial glows) ----------
function radialSprite(size, stops){
  var c = document.createElement('canvas');
  c.width = c.height = size;
  var x = c.getContext('2d');
  var g = x.createRadialGradient(size/2,size/2,0, size/2,size/2,size/2);
  for(var i=0;i<stops.length;i++) g.addColorStop(stops[i][0], stops[i][1]);
  x.fillStyle = g;
  x.fillRect(0,0,size,size);
  return c;
}
var SPR = {
  flame0: radialSprite(128,[[0,'rgba(255,255,236,1)'],[0.22,'rgba(255,226,150,0.95)'],[0.58,'rgba(255,148,56,0.4)'],[1,'rgba(255,84,20,0)']]),
  flame1: radialSprite(128,[[0,'rgba(255,238,176,1)'],[0.3,'rgba(255,176,72,0.9)'],[0.68,'rgba(226,88,26,0.34)'],[1,'rgba(170,40,10,0)']]),
  flame2: radialSprite(128,[[0,'rgba(255,178,96,0.95)'],[0.36,'rgba(232,96,32,0.72)'],[0.74,'rgba(150,42,14,0.26)'],[1,'rgba(90,22,10,0)']]),
  flame3: radialSprite(128,[[0,'rgba(206,86,42,0.8)'],[0.5,'rgba(122,42,24,0.4)'],[1,'rgba(52,20,14,0)']]),
  glowWarm: radialSprite(256,[[0,'rgba(255,196,116,0.58)'],[0.38,'rgba(255,132,52,0.24)'],[1,'rgba(255,92,30,0)']]),
  smoke: radialSprite(128,[[0,'rgba(44,42,40,0.55)'],[0.6,'rgba(30,29,28,0.26)'],[1,'rgba(20,20,20,0)']]),
  spark: radialSprite(32,[[0,'rgba(255,255,232,1)'],[0.45,'rgba(255,204,96,0.85)'],[1,'rgba(255,140,40,0)']]),
  pick: radialSprite(64,[[0,'rgba(255,236,180,0.9)'],[0.5,'rgba(255,150,60,0.35)'],[1,'rgba(255,110,40,0)']])
};
var FLAME_SPR = [SPR.flame0, SPR.flame1, SPR.flame1, SPR.flame2, SPR.flame3];

function drawSprite(spr,x,y,size,alpha){
  if(alpha<=0.003) return;
  ctx.globalAlpha = alpha>1?1:alpha;
  ctx.drawImage(spr, x-size/2, y-size/2, size, size);
  ctx.globalAlpha = 1;
}

// ---------- audio (procedural, unlocked on first input) ----------
var AC = null, master = null, noiseBuf = null, flameGain = null;
var muted = false, flameSoundOn = false;

function audioInit(){
  if(AC){ if(AC.state==='suspended') AC.resume(); return; }
  try{
    var Ctor = window.AudioContext || window.webkitAudioContext;
    if(!Ctor) return;
    AC = new Ctor();
    master = AC.createGain();
    master.gain.value = muted ? 0 : 0.6;
    master.connect(AC.destination);

    noiseBuf = AC.createBuffer(1, AC.sampleRate*2, AC.sampleRate);
    var d = noiseBuf.getChannelData(0);
    for(var i=0;i<d.length;i++) d[i] = Math.random()*2-1;

    var src = AC.createBufferSource();
    src.buffer = noiseBuf; src.loop = true;
    var bp = AC.createBiquadFilter();
    bp.type='bandpass'; bp.frequency.value=740; bp.Q.value=0.7;
    flameGain = AC.createGain();
    flameGain.gain.value = 0;
    src.connect(bp); bp.connect(flameGain); flameGain.connect(master);
    src.start();
  }catch(e){ AC = null; }
}
function setFlameSound(on){
  if(on===flameSoundOn) return;
  flameSoundOn = on;
  if(flameGain && AC) flameGain.gain.setTargetAtTime(on?0.24:0, AC.currentTime, 0.06);
}
function sfxTone(f0,f1,dur,type,vol,delay){
  if(!AC) return;
  var t0 = AC.currentTime + (delay||0);
  var o = AC.createOscillator();
  o.type = type||'sine';
  o.frequency.setValueAtTime(f0,t0);
  if(f1 && f1!==f0) o.frequency.exponentialRampToValueAtTime(Math.max(1,f1), t0+dur);
  var g = AC.createGain();
  g.gain.setValueAtTime(0,t0);
  g.gain.linearRampToValueAtTime(vol,t0+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  o.connect(g); g.connect(master);
  o.start(t0); o.stop(t0+dur+0.03);
}
function sfxNoise(dur,fType,f0,f1,vol,Q,delay){
  if(!AC) return;
  var t0 = AC.currentTime + (delay||0);
  var s = AC.createBufferSource();
  s.buffer = noiseBuf; s.loop = true;
  var f = AC.createBiquadFilter();
  f.type = fType||'lowpass';
  f.frequency.setValueAtTime(f0,t0);
  if(f1 && f1!==f0) f.frequency.exponentialRampToValueAtTime(Math.max(10,f1), t0+dur);
  f.Q.value = Q===undefined?0.8:Q;
  var g = AC.createGain();
  g.gain.setValueAtTime(0,t0);
  g.gain.linearRampToValueAtTime(vol,t0+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  s.connect(f); f.connect(g); g.connect(master);
  s.start(t0); s.stop(t0+dur+0.03);
}
var sfx = {
  kill: function(){ sfxNoise(0.16,'lowpass',900,300,0.2); sfxTone(rand(150,240),60,0.2,'sawtooth',0.1); },
  hurt: function(){ sfxTone(200,68,0.24,'square',0.2); sfxNoise(0.2,'lowpass',520,170,0.24); },
  explode: function(){ sfxNoise(0.75,'lowpass',950,80,0.5,0.6); sfxTone(150,34,0.6,'sine',0.4); sfxNoise(0.24,'highpass',1800,420,0.2); },
  nova: function(){ sfxNoise(0.5,'bandpass',300,2300,0.28,1.4); sfxTone(330,80,0.45,'sawtooth',0.13); },
  dash: function(){ sfxNoise(0.22,'bandpass',950,220,0.16,1.2); },
  pickup: function(){ sfxTone(760,1160,0.09,'sine',0.15); sfxTone(1180,1560,0.09,'sine',0.1,0.08); },
  overheat: function(){ sfxNoise(0.3,'highpass',1500,3300,0.18); sfxTone(540,170,0.16,'square',0.1); },
  wave: function(){ sfxTone(96,92,0.8,'sawtooth',0.13); sfxTone(97.5,94,0.8,'sawtooth',0.11,0.02); sfxTone(192,188,0.5,'triangle',0.06,0.05); },
  growl: function(){ sfxTone(rand(68,112),rand(44,64),0.34,'sawtooth',0.06); sfxNoise(0.3,'lowpass',320,150,0.05); },
  meteor: function(){ sfxTone(1500,220,0.5,'sine',0.11); },
  crackle: function(){ sfxNoise(0.05,'highpass',1200,2500,0.05); },
  gameover: function(){ sfxTone(220,38,1.3,'sawtooth',0.22); sfxNoise(1.1,'lowpass',620,70,0.28); }
};
function toggleMute(){
  muted = !muted;
  if(master) master.gain.setTargetAtTime(muted?0:0.6, AC.currentTime, 0.05);
  try{ localStorage.setItem('infernodead.muted', muted?'1':'0'); }catch(e){}
  showMsg(muted?'MUTED':'SOUND ON','', '#9fb6c8');
}

// ---------- text ----------
function dtext(str,x,y,o){
  o = o||{};
  var size = o.size||16;
  ctx.save();
  ctx.globalAlpha = o.alpha===undefined?1:o.alpha;
  ctx.font = (o.weight||'700')+' '+size+'px '+FONT;
  ctx.textAlign = o.align||'center';
  ctx.textBaseline = o.baseline||'middle';
  if(o.shadow){
    ctx.shadowColor = o.shadowColor||'rgba(255,140,40,0.85)';
    ctx.shadowBlur = o.shadow;
  }
  if(o.outline){
    ctx.lineWidth = o.outline;
    ctx.strokeStyle = o.outlineColor||'rgba(0,0,0,0.85)';
    ctx.lineJoin = 'round';
    ctx.strokeText(str,x,y);
  }
  ctx.fillStyle = o.color||'#fff';
  ctx.fillText(str,x,y);
  ctx.restore();
}

// ---------- game state ----------
var G = {
  state: 'title',
  t: 0,
  wave: 0,
  score: 0,
  best: 0,
  kills: 0,
  combo: 0,
  comboT: 0,
  toSpawn: 0,
  spawnTimer: 0,
  betweenWaves: 0,
  bossQueued: false,
  shakeT: 0,
  shakeMag: 0,
  flashT: 0,
  msg: null,
  overAt: 0,
  hintT: 12
};
var shake = { t:0, mag:0 };
var mouse = { x:0, y:0, down:false };
var touch = { active:false, x:0, y:0, n:0 };
var keys = {};
var flameAcc = 0, crackleT = 0, growlT = 2, emberAcc = 0;
var zid = 0;
var FLAME_MAX = 520, SPARK_MAX = 900, ASH_MAX = 420, SMOKE_MAX = 220, EMBER_MAX = 170, DECAL_MAX = 60;
var NOVA_CD = 7, METEOR_CD = 11, DASH_CD = 1.7;

var player = {
  x:0, y:0, r:13,
  hp:100, maxHp:100,
  vx:0, vy:0, kx:0, ky:0,
  angle:-Math.PI/2,
  heat:0, overheat:false,
  invuln:0, dashCd:0, dashT:0, dashQueued:false,
  novaCd:0, meteorCd:0,
  firing:false, muzzle:0
};

var zombies = [], flames = [], sparks = [], ash = [], smokes = [], flashes = [];
var pickups = [], texts = [], pools = [], rings = [], meteors = [], decals = [], embers = [];

// ---------- particles / effects ----------
function addSparks(x,y,n,spread,hot){
  for(var i=0;i<n && sparks.length<SPARK_MAX;i++){
    var a = Math.random()*TAU, sp = rand(40, spread||240);
    sparks.push({
      x:x, y:y,
      vx:Math.cos(a)*sp, vy:Math.sin(a)*sp,
      life:0, max:rand(0.25,0.72),
      size:rand(1,2.8),
      color: hot===false ? 'rgba(255,150,80,' : 'rgba(255,225,150,'
    });
  }
}
function addAsh(x,y,n){
  for(var i=0;i<n && ash.length<ASH_MAX;i++){
    var a = Math.random()*TAU, sp = rand(8,70);
    ash.push({
      x:x, y:y,
      vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - 14,
      life:0, max:rand(0.9,2.2),
      size:rand(1.4,3.6),
      g:rand(0,0.9)
    });
  }
}
function addSmoke(x,y,n){
  for(var i=0;i<n && smokes.length<SMOKE_MAX;i++){
    smokes.push({
      x:x+rand(-8,8), y:y+rand(-8,8),
      vx:rand(-16,16), vy:rand(-34,-6),
      life:0, max:rand(0.8,1.7),
      size:rand(12,28)
    });
  }
}
function addFlash(x,y,r){
  flashes.push({ x:x, y:y, r:r, life:0, max:0.22 });
}
function addDecal(x,y,r){
  decals.push({ x:x, y:y, r:r, life:22, max:22 });
  if(decals.length>DECAL_MAX) decals.shift();
}
function addText(x,y,str,color,size){
  if(texts.length>70) texts.shift();
  texts.push({ x:x, y:y, str:str, color:color||'#ffe9b0', size:size||13, life:0, max:1.0 });
}
function addShake(mag,t){ shake.mag = Math.max(shake.mag,mag); shake.t = Math.max(shake.t, t||0.35); }
function showMsg(text,sub,color){ G.msg = { text:text, sub:sub||'', color:color||'#ffb056', t:0, dur:2.4 }; }

// ---------- sprites for zombies / player ----------
function zombieColors(z){
  switch(z.type){
    case 'runner': return { body:'#6f8f45', head:'#8aa958', eye:'#231f14' };
    case 'brute': return { body:'#4a5f33', head:'#66803f', eye:'#3a1010' };
    case 'abomination': return { body:'#3f5230', head:'#5a7040', eye:'#ff2a1a' };
    default: return { body:'#5b7a3c', head:'#7d9c52', eye:'#1c2416' };
  }
}
function bodyColor(z){
  var c = zombieColors(z);
  return z.hitFlash>0 ? '#ffffff' : c.body;
}

var DASH_SPEED = 3.3, PLAYER_SPEED = 268;

// ---------- spawning ----------
function spawnPos(){
  var m = 46, side = randi(0,3), x, y;
  if(side===0){ x = rand(0,W); y = -m; }
  else if(side===1){ x = W+m; y = rand(0,H); }
  else if(side===2){ x = rand(0,W); y = H+m; }
  else { x = -m; y = rand(0,H); }
  return { x:x, y:y };
}
function pickType(w){
  var r = Math.random();
  var runnerC = w>=2 ? Math.min(0.42, 0.08+w*0.05) : 0;
  var bruteC = w>=4 ? Math.min(0.2, 0.03+(w-4)*0.03) : 0;
  if(r < bruteC) return 'brute';
  if(r < bruteC+runnerC) return 'runner';
  return 'walker';
}
function makeZombie(type,x,y,wave){
  var hpMul = 1+(wave-1)*0.13, spMul = Math.min(1.4, 1+(wave-1)*0.02);
  var z = {
    id:++zid, type:type, x:x, y:y,
    vx:0, vy:0, kx:0, ky:0,
    seed:rand(0,1000), ang:0,
    burning:0, burnEmit:0, flameCd:0, atkCd:rand(0.3,0.8),
    hitFlash:0, wobble:0, dead:false
  };
  if(type==='runner'){ z.r=12; z.hp=z.maxhp=20*hpMul; z.speed=118*spMul; z.dmg=9; z.score=15; }
  else if(type==='brute'){ z.r=26; z.hp=z.maxhp=190*hpMul; z.speed=42*spMul; z.dmg=26; z.score=40; }
  else if(type==='abomination'){ z.r=40; z.hp=z.maxhp=620*hpMul; z.speed=46*spMul; z.dmg=38; z.score=300; }
  else { z.r=15; z.hp=z.maxhp=30*hpMul; z.speed=54*spMul; z.dmg=13; z.score=10; }
  return z;
}
function startWave(n){
  G.wave = n;
  G.toSpawn = 5 + Math.ceil(n*2.6);
  G.spawnTimer = 0.8;
  G.bossQueued = (n%5===0);
  if(G.bossQueued) G.toSpawn = Math.max(4, G.toSpawn-2);
  sfx.wave();
  showMsg('WAVE '+n, G.bossQueued ? 'THE ABOMINATION RISES' : '', G.bossQueued?'#ff5c3a':'#ffb056');
}
function dropLoot(x,y,type){
  var a = Math.random()*TAU, sp = rand(30,90);
  pickups.push({ x:x, y:y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, type:type, life:0, max:22, bob:rand(0,10) });
}
function collectPickup(p){
  if(p.type==='heart'){
    player.hp = Math.min(player.maxHp, player.hp+25);
    addText(player.x, player.y-24, '+25 HP', '#7dff9a', 15);
    addSparks(p.x,p.y,10,180,false);
  } else if(p.type==='fuel'){
    player.heat = Math.max(0, player.heat-0.65);
    if(player.overheat && player.heat<=0.18) player.overheat = false;
    addText(player.x, player.y-24, 'COOLANT', '#7fd8ff', 15);
    addSparks(p.x,p.y,12,180,false);
  } else {
    G.score += 75;
    addText(p.x, p.y-14, '+75', '#ffd27a', 13);
  }
  sfx.pickup();
}

// ---------- combat ----------
function hurtZombie(z,dmg,ignite,kx,ky){
  if(z.dead) return;
  z.hp -= dmg;
  z.hitFlash = 0.1;
  if(ignite && z.burning < 2.6) z.burning = 2.6;
  if(kx || ky){ z.kx += (kx||0); z.ky += (ky||0); }
  if(z.hp<=0) killZombie(z);
}
function killZombie(z){
  if(z.dead) return;
  z.dead = true;
  G.kills++;
  G.combo++;
  G.comboT = 2.6;
  var mult = 1+Math.min(G.combo,40)*0.05;
  var pts = Math.round(z.score*mult);
  G.score += pts;
  var big = (z.type==='abomination');
  addText(z.x, z.y-10, '+'+pts, big?'#ffd27a':'#ffe9b0', big?24:13);
  addSparks(z.x,z.y, big?46:14, big?420:260);
  addAsh(z.x,z.y, big?28:9);
  addSmoke(z.x,z.y, big?12:3);
  addFlash(z.x,z.y, big?160:48);
  addShake(big?17:(z.type==='brute'?7:3));
  sfx.kill();
  if(big) addDecal(z.x,z.y,72);
  var r = Math.random();
  if(z.type==='brute'||z.type==='abomination') dropLoot(z.x,z.y,'heart');
  else if(r<0.09) dropLoot(z.x,z.y,'heart');
  else if(r<0.18) dropLoot(z.x,z.y,'fuel');
  else if(r<0.42) dropLoot(z.x,z.y,'ember');
}
function hurtPlayer(dmg,fx,fy){
  if(G.state!=='playing' || player.invuln>0) return;
  player.hp -= dmg;
  player.invuln = 0.85;
  G.flashT = 0.4;
  addShake(11);
  sfx.hurt();
  var a = Math.atan2(player.y-fy, player.x-fx);
  player.kx += Math.cos(a)*220;
  player.ky += Math.sin(a)*220;
  if(player.hp<=0){ player.hp = 0; gameOver(); }
}
function nearestZombie(maxD){
  var best = null, bd = maxD===undefined?1e9:maxD*maxD;
  for(var i=0;i<zombies.length;i++){
    var z = zombies[i];
    var dx = z.x-player.x, dy = z.y-player.y, d = dx*dx+dy*dy;
    if(d<bd){ bd = d; best = z; }
  }
  return best;
}
function castNova(){
  if(G.state!=='playing' || player.novaCd>0) return;
  player.novaCd = NOVA_CD;
  rings.push({ x:player.x, y:player.y, r:26, maxR:300, life:0, max:0.45, hit:{} });
  sfx.nova();
  addShake(10);
  addFlash(player.x,player.y,130);
}
function castMeteor(){
  if(G.state!=='playing' || player.meteorCd>0) return;
  var tx, ty;
  if(touch.active){
    var z = nearestZombie();
    if(z){ tx = z.x; ty = z.y; } else { tx = player.x; ty = player.y; }
  } else { tx = mouse.x; ty = mouse.y; }
  player.meteorCd = METEOR_CD;
  meteors.push({ x:tx, y:ty, t:0.55, max:0.55, seed:rand(0,10) });
  sfx.meteor();
}
function meteorImpact(m){
  var R = 130, i, z, dx, dy, d;
  for(i=0;i<zombies.length;i++){
    z = zombies[i];
    dx = z.x-m.x; dy = z.y-m.y; d = hypot(dx,dy);
    if(d < R+z.r){
      var fall = clamp(1 - d/(R+z.r), 0, 1);
      var dmg = 60 + 100*fall;
      var nx = d>1?dx/d:0, ny = d>1?dy/d:0;
      hurtZombie(z, dmg, true, nx*420*(z.type==='abomination'?0.15:1), ny*420*(z.type==='abomination'?0.15:1));
    }
  }
  pools.push({ x:m.x, y:m.y, r:108, life:5.5, max:5.5 });
  addDecal(m.x,m.y,86);
  addSparks(m.x,m.y,60,560);
  addAsh(m.x,m.y,34);
  addSmoke(m.x,m.y,16);
  addFlash(m.x,m.y,260);
  addShake(22,0.6);
  sfx.explode();
}

// ---------- update: player ----------
function updatePlayer(dt){
  var p = player;
  p.invuln = Math.max(0,p.invuln-dt);
  p.dashCd = Math.max(0,p.dashCd-dt);
  p.novaCd = Math.max(0,p.novaCd-dt);
  p.meteorCd = Math.max(0,p.meteorCd-dt);
  p.muzzle = Math.max(0,p.muzzle-dt);

  var ax = 0, ay = 0;
  if(keys.KeyW || keys.ArrowUp) ay -= 1;
  if(keys.KeyS || keys.ArrowDown) ay += 1;
  if(keys.KeyA || keys.ArrowLeft) ax -= 1;
  if(keys.KeyD || keys.ArrowRight) ax += 1;
  if(touch.active){
    var tdx = touch.x-p.x, tdy = touch.y-p.y, td = hypot(tdx,tdy);
    if(td>44){ ax = tdx/td; ay = tdy/td; }
  }
  var l = hypot(ax,ay);
  if(l>0){ ax/=l; ay/=l; }

  // dash
  if(p.dashQueued){
    p.dashQueued = false;
    if(p.dashCd<=0){
      var dax = ax, day = ay;
      if(!dax && !day){ dax = Math.cos(p.angle); day = Math.sin(p.angle); }
      p.dashT = 0.16;
      p.dashCd = DASH_CD;
      p.invuln = Math.max(p.invuln,0.3);
      p.vx = dax*PLAYER_SPEED*DASH_SPEED;
      p.vy = day*PLAYER_SPEED*DASH_SPEED;
      sfx.dash();
      addSparks(p.x,p.y,12,220);
    }
  }
  if(p.dashT>0){
    p.dashT -= dt;
    if(Math.random()<0.85 && flames.length<FLAME_MAX){
      flames.push({
        x:p.x+rand(-8,8), y:p.y+rand(-8,8),
        vx:rand(-40,40), vy:rand(-40,40),
        life:0, max:rand(0.24,0.42), size:rand(9,15), seed:rand(0,10)
      });
    }
  }

  var speed = PLAYER_SPEED*(p.dashT>0?DASH_SPEED:1);
  var k = 1-Math.exp(-14*dt);
  p.vx = lerp(p.vx, ax*speed, k);
  p.vy = lerp(p.vy, ay*speed, k);
  p.x += (p.vx+p.kx)*dt;
  p.y += (p.vy+p.ky)*dt;
  p.kx *= Math.exp(-6*dt);
  p.ky *= Math.exp(-6*dt);
  p.x = clamp(p.x, p.r, W-p.r);
  p.y = clamp(p.y, p.r, H-p.r);

  // aim
  var targetAngle = p.angle;
  if(touch.active){
    var tz = nearestZombie(460);
    if(tz) targetAngle = Math.atan2(tz.y-p.y, tz.x-p.x);
    else if(ax||ay) targetAngle = Math.atan2(ay,ax);
  } else {
    targetAngle = Math.atan2(mouse.y-p.y, mouse.x-p.x);
  }
  p.angle = angleLerp(p.angle, targetAngle, 1-Math.exp(-25*dt));

  // firing
  var wantFire = (mouse.down && !touch.active);
  if(touch.active && !wantFire){
    var nz = nearestZombie(430);
    if(nz) wantFire = true;
  }
  p.firing = wantFire && !p.overheat && G.state==='playing';
  if(p.firing){
    p.heat += dt*0.42;
    if(p.heat>=1){ p.heat = 1; p.overheat = true; sfx.overheat(); }
    p.muzzle = 0.05;
    flameAcc += dt*135;
    while(flameAcc>=1 && flames.length<FLAME_MAX){
      flameAcc -= 1;
      var a = p.angle+rand(-0.24,0.24), sp = rand(430,650);
      flames.push({
        x:p.x+Math.cos(p.angle)*16+rand(-3,3),
        y:p.y+Math.sin(p.angle)*16+rand(-3,3),
        vx:Math.cos(a)*sp+p.vx*0.25,
        vy:Math.sin(a)*sp+p.vy*0.25,
        life:0, max:rand(0.26,0.42), size:rand(10,17), seed:rand(0,10)
      });
    }
    crackleT -= dt;
    if(crackleT<=0){ crackleT = rand(0.03,0.12); sfx.crackle(); }
    setFlameSound(true);
  } else {
    setFlameSound(false);
    p.heat = Math.max(0, p.heat-dt*0.5);
    if(p.overheat && p.heat<=0.18) p.overheat = false;
  }
}

// ---------- update: zombies ----------
function updateZombies(dt){
  var i, j, z, a, b;
  for(i=zombies.length-1;i>=0;i--){
    z = zombies[i];
    z.flameCd = Math.max(0,z.flameCd-dt);
    z.hitFlash = Math.max(0,z.hitFlash-dt);
    z.atkCd = Math.max(0,z.atkCd-dt);

    if(z.burning>0){
      z.burning -= dt;
      z.hp -= 16*dt;
      z.burnEmit -= dt;
      if(z.burnEmit<=0 && flames.length<FLAME_MAX){
        z.burnEmit = 0.05;
        flames.push({
          x:z.x+rand(-z.r*0.6,z.r*0.6),
          y:z.y+rand(-z.r*0.6,z.r*0.6),
          vx:rand(-25,25), vy:rand(-58,-8),
          life:0, max:rand(0.22,0.45), size:rand(6,13), seed:rand(0,10)
        });
      }
      if(z.hp<=0){ killZombie(z); zombies.splice(i,1); continue; }
    }

    var ang = Math.atan2(player.y-z.y, player.x-z.x);
    var sp = z.speed*(z.burning>0?1.28:1);
    var jx = 0, jy = 0;
    if(z.burning>0){
      jx = Math.sin(G.t*23+z.seed)*38;
      jy = Math.cos(G.t*19+z.seed*1.3)*38;
    }
    z.x += (Math.cos(ang)*sp+jx+z.kx)*dt;
    z.y += (Math.sin(ang)*sp+jy+z.ky)*dt;
    z.kx *= Math.exp(-4*dt);
    z.ky *= Math.exp(-4*dt);
    z.ang = angleLerp(z.ang, ang, 1-Math.exp(-6*dt));

    var dx = player.x-z.x, dy = player.y-z.y, d = hypot(dx,dy);
    if(d < z.r+player.r+2){
      if(z.atkCd<=0){ z.atkCd = 0.95; hurtPlayer(z.dmg, z.x, z.y); }
      var push = (z.r+player.r+2)-d;
      if(push>0 && d>0.001){ z.x -= dx/d*push; z.y -= dy/d*push; }
    }
  }

  // separation + fire spreading
  for(i=0;i<zombies.length;i++){
    a = zombies[i];
    for(j=i+1;j<zombies.length;j++){
      b = zombies[j];
      var sx = b.x-a.x, sy = b.y-a.y;
      var min = a.r+b.r-2;
      var d2 = sx*sx+sy*sy;
      if(d2>0.0001 && d2<min*min){
        var dd = Math.sqrt(d2);
        var nx = sx/dd, ny = sy/dd;
        var p2 = (min-dd)*0.5;
        a.x -= nx*p2; a.y -= ny*p2;
        b.x += nx*p2; b.y += ny*p2;
        if(a.burning>0 && b.burning<=0 && Math.random()<dt*0.6) b.burning = 2.6;
        else if(b.burning>0 && a.burning<=0 && Math.random()<dt*0.6) a.burning = 2.6;
      }
    }
  }
}

// ---------- update: flames ----------
function updateFlames(dt){
  for(var i=flames.length-1;i>=0;i--){
    var f = flames[i];
    f.life += dt;
    if(f.life>=f.max){ flames.splice(i,1); continue; }
    var dr = Math.exp(-2.4*dt);
    f.vx *= dr; f.vy *= dr;
    f.x += (f.vx + Math.sin(G.t*17+f.seed)*30)*dt;
    f.y += (f.vy + Math.cos(G.t*13+f.seed*1.7)*30)*dt;
    if(f.x<-50||f.x>W+50||f.y<-50||f.y>H+50){ flames.splice(i,1); continue; }
    for(var j=0;j<zombies.length;j++){
      var z = zombies[j];
      if(z.flameCd>0) continue;
      var rr2 = z.r + f.size*0.55;
      var dx = z.x-f.x, dy = z.y-f.y;
      if(dx*dx+dy*dy < rr2*rr2){
        z.flameCd = 0.085;
        hurtZombie(z, 7, true);
      }
    }
  }
}

// ---------- update: pools / rings / meteors / pickups ----------
function updatePools(dt){
  for(var i=pools.length-1;i>=0;i--){
    var p = pools[i];
    p.life -= dt;
    if(p.life<=0){ pools.splice(i,1); continue; }
    for(var j=0;j<zombies.length;j++){
      var z = zombies[j];
      var dx = z.x-p.x, dy = z.y-p.y;
      var rr2 = p.r+z.r*0.5;
      if(dx*dx+dy*dy < rr2*rr2){
        z.hp -= 34*dt;
        if(z.burning<1.4) z.burning = 1.4;
        if(Math.random()<dt*5 && flames.length<FLAME_MAX){
          flames.push({
            x:p.x+rand(-p.r*0.8,p.r*0.8), y:p.y+rand(-p.r*0.8,p.r*0.8),
            vx:rand(-30,30), vy:rand(-70,-10),
            life:0, max:rand(0.25,0.5), size:rand(7,14), seed:rand(0,10)
          });
        }
        if(z.hp<=0) killZombie(z);
      }
    }
  }
}
function updateRings(dt){
  for(var i=rings.length-1;i>=0;i--){
    var r = rings[i];
    r.life += dt;
    r.r += (r.maxR-r.r)*(1-Math.exp(-7*dt));
    if(r.life>=r.max && r.r>r.maxR*0.94){ rings.splice(i,1); continue; }
    for(var j=0;j<zombies.length;j++){
      var z = zombies[j];
      if(r.hit[z.id]) continue;
      var dx = z.x-r.x, dy = z.y-r.y, d = hypot(dx,dy);
      if(d > r.r-30 && d < r.r+34){
        r.hit[z.id] = 1;
        var nx = d>1?dx/d:0, ny = d>1?dy/d:0;
        hurtZombie(z, 65, true, nx*350*(z.type==='abomination'?0.15:1), ny*350*(z.type==='abomination'?0.15:1));
      }
    }
    if(Math.random()<dt*60 && flames.length<FLAME_MAX){
      var a = Math.random()*TAU;
      flames.push({
        x:r.x+Math.cos(a)*r.r, y:r.y+Math.sin(a)*r.r,
        vx:Math.cos(a)*120, vy:Math.sin(a)*120,
        life:0, max:rand(0.2,0.4), size:rand(8,15), seed:rand(0,10)
      });
    }
  }
}
function updateMeteors(dt){
  for(var i=meteors.length-1;i>=0;i--){
    var m = meteors[i];
    m.t -= dt;
    if(Math.random()<dt*70) addSparks(m.x+rand(-40,40), m.y-rand(60,260), 1, 60);
    if(m.t<=0){ meteorImpact(m); meteors.splice(i,1); }
  }
}
function updatePickups(dt){
  for(var i=pickups.length-1;i>=0;i--){
    var p = pickups[i];
    p.life += dt;
    if(p.life>=p.max){ pickups.splice(i,1); continue; }
    p.bob += dt*3;
    var dx = player.x-p.x, dy = player.y-p.y, d = hypot(dx,dy);
    if(d<150){
      var pull = (1-d/150)*820;
      p.vx += dx/d*pull*dt;
      p.vy += dy/d*pull*dt;
    }
    p.vx *= Math.exp(-2.2*dt);
    p.vy *= Math.exp(-2.2*dt);
    p.x += p.vx*dt;
    p.y += p.vy*dt;
    if(d < player.r+14){ collectPickup(p); pickups.splice(i,1); }
  }
}
function updateParticles(dt){
  var i;
  for(i=sparks.length-1;i>=0;i--){
    var s = sparks[i];
    s.life += dt;
    if(s.life>=s.max){ sparks.splice(i,1); continue; }
    s.vx *= Math.exp(-2.6*dt);
    s.vy *= Math.exp(-2.6*dt);
    s.x += s.vx*dt; s.y += s.vy*dt;
  }
  for(i=ash.length-1;i>=0;i--){
    var a = ash[i];
    a.life += dt;
    if(a.life>=a.max){ ash.splice(i,1); continue; }
    a.vx *= Math.exp(-1.6*dt);
    a.vy *= Math.exp(-1.6*dt);
    a.x += a.vx*dt; a.y += a.vy*dt;
  }
  for(i=smokes.length-1;i>=0;i--){
    var m = smokes[i];
    m.life += dt;
    if(m.life>=m.max){ smokes.splice(i,1); continue; }
    m.x += m.vx*dt; m.y += m.vy*dt;
    m.vx *= Math.exp(-1.2*dt);
  }
  for(i=flashes.length-1;i>=0;i--){
    var f = flashes[i];
    f.life += dt;
    if(f.life>=f.max) flashes.splice(i,1);
  }
  for(i=texts.length-1;i>=0;i--){
    var t = texts[i];
    t.life += dt;
    if(t.life>=t.max) texts.splice(i,1);
    else t.y -= 24*dt;
  }
  for(i=decals.length-1;i>=0;i--){
    var dc = decals[i];
    dc.life -= dt;
    if(dc.life<=0) decals.splice(i,1);
  }
  for(i=embers.length-1;i>=0;i--){
    var e = embers[i];
    e.life += dt;
    if(e.life>=e.max || e.y<-30){ embers.splice(i,1); continue; }
    e.x += (e.vx+Math.sin(G.t*2+e.seed)*22)*dt;
    e.y += e.vy*dt;
  }
}
function updateEmberEmitter(dt){
  emberAcc += dt*7;
  while(emberAcc>=1){
    emberAcc -= 1;
    if(embers.length<EMBER_MAX){
      embers.push({
        x:rand(0,W), y:H+12,
        vx:rand(-14,14), vy:rand(-70,-26),
        life:0, max:rand(2.6,6), size:rand(1.2,3), seed:rand(0,10)
      });
    }
  }
}
function updateSpawner(dt){
  if(G.betweenWaves>0){
    G.betweenWaves -= dt;
    if(G.betweenWaves<=0) startWave(G.wave+1);
    return;
  }
  if(G.toSpawn>0){
    G.spawnTimer -= dt;
    if(G.spawnTimer<=0){
      if(G.bossQueued){
        G.bossQueued = false;
        var pb = spawnPos();
        zombies.push(makeZombie('abomination', pb.x, pb.y, G.wave));
        addShake(8);
        G.spawnTimer = 1.1;
        sfx.growl();
      } else {
        var k = randi(1, Math.min(3, 1+Math.floor(G.wave/3)));
        for(var i=0;i<k && G.toSpawn>0;i++){
          G.toSpawn--;
          var p = spawnPos();
          zombies.push(makeZombie(pickType(G.wave), p.x, p.y, G.wave));
        }
        G.spawnTimer = Math.max(0.22,(1.05-G.wave*0.05))*rand(0.7,1.3);
        if(Math.random()<0.4) sfx.growl();
      }
    }
  } else if(zombies.length===0){
    G.betweenWaves = 4.5;
    var bonus = 60*G.wave;
    G.score += bonus;
    player.hp = Math.min(player.maxHp, player.hp+14);
    showMsg('WAVE '+G.wave+' CLEARED','+'+bonus+' BONUS  ·  +14 HP', '#ffd27a');
    sfx.pickup();
  }
}
function update(dt){
  G.t += dt;
  updateEmberEmitter(dt);
  updateParticles(dt);
  shake.t = Math.max(0, shake.t-dt);
  G.flashT = Math.max(0, G.flashT-dt);
  if(G.msg){ G.msg.t += dt; if(G.msg.t>=G.msg.dur) G.msg = null; }

  if(G.state==='playing'){
    updatePlayer(dt);
    updateFlames(dt);
    updateZombies(dt);
    updatePools(dt);
    updateRings(dt);
    updateMeteors(dt);
    updatePickups(dt);
    updateSpawner(dt);
    if(G.comboT>0){ G.comboT -= dt; if(G.comboT<=0) G.combo = 0; }
    growlT -= dt;
    if(growlT<=0){ growlT = rand(1.6,4.2); if(zombies.length) sfx.growl(); }
  } else if(G.state==='gameover'){
    updateFlames(dt);
    updatePools(dt);
  }
}

// ---------- rendering ----------
function drawGround(){
  if(ground) ctx.drawImage(ground,0,0,W,H);
  else { ctx.fillStyle = '#0f1116'; ctx.fillRect(0,0,W,H); }
}
function drawDecals(){
  for(var i=0;i<decals.length;i++){
    var d = decals[i];
    var a = clamp(d.life/d.max,0,1)*0.55;
    ctx.globalAlpha = a;
    var g = ctx.createRadialGradient(d.x,d.y,0,d.x,d.y,d.r);
    g.addColorStop(0,'rgba(8,6,6,0.9)');
    g.addColorStop(0.7,'rgba(12,8,6,0.55)');
    g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(d.x,d.y,d.r,0,TAU); ctx.fill();
    ctx.globalAlpha = 1;
  }
}
function drawPoolsLayer(){
  for(var i=0;i<pools.length;i++){
    var p = pools[i];
    var k = clamp(p.life/p.max,0,1);
    var puls = 0.88+Math.sin(G.t*17+p.x*0.05)*0.12;
    ctx.globalCompositeOperation = 'lighter';
    drawSprite(SPR.glowWarm, p.x, p.y, p.r*2.9*puls, 0.4*Math.min(1,k*3));
    drawSprite(SPR.flame1, p.x, p.y, p.r*1.35*puls, 0.5*Math.min(1,k*3));
    drawSprite(SPR.flame0, p.x, p.y, p.r*0.8*puls, 0.35*Math.min(1,k*3));
    ctx.globalCompositeOperation = 'source-over';
  }
}
function drawZombie(z){
  var c = zombieColors(z);
  ctx.save();
  ctx.translate(z.x,z.y);

  ctx.fillStyle = 'rgba(0,0,0,0.42)';
  ctx.beginPath(); ctx.ellipse(2,4,z.r*1.05,z.r*0.82,0,0,TAU); ctx.fill();

  ctx.rotate(z.ang);
  var wob = Math.sin(G.t*(z.type==='runner'?14:7)+z.seed)*(z.type==='abomination'?2:4);

  // reaching arms
  ctx.fillStyle = z.hitFlash>0?'#fff':c.body;
  ctx.beginPath(); ctx.arc(z.r*0.72,-z.r*0.6+wob*0.5, z.r*0.3, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(z.r*0.72, z.r*0.6-wob*0.5, z.r*0.3, 0, TAU); ctx.fill();

  // body
  ctx.beginPath(); ctx.ellipse(0,0,z.r,z.r*0.88,0,0,TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.5)';
  ctx.lineWidth = 2;
  ctx.stroke();

  // torn flesh
  ctx.fillStyle = 'rgba(96,22,20,0.6)';
  ctx.beginPath(); ctx.arc(-z.r*0.2, z.r*0.14, z.r*0.38, 0, TAU); ctx.fill();

  // head
  ctx.fillStyle = z.hitFlash>0?'#fff':c.head;
  ctx.beginPath(); ctx.arc(z.r*0.42, 0, z.r*0.46, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.45)';
  ctx.stroke();

  // eyes
  ctx.fillStyle = (z.burning>0) ? '#ffb03a' : c.eye;
  ctx.beginPath();
  ctx.arc(z.r*0.66,-z.r*0.17, z.r*0.1, 0, TAU);
  ctx.arc(z.r*0.66, z.r*0.17, z.r*0.1, 0, TAU);
  ctx.fill();

  ctx.restore();

  // burning glow
  if(z.burning>0){
    var fl = 0.75+Math.sin(G.t*30+z.seed)*0.25;
    ctx.globalCompositeOperation = 'lighter';
    drawSprite(SPR.glowWarm, z.x, z.y, z.r*4.2*fl, 0.32);
    drawSprite(SPR.flame0, z.x+rand(-z.r*0.4,z.r*0.4), z.y+rand(-z.r*0.4,z.r*0.4), z.r*1.7*fl, 0.55);
    ctx.globalCompositeOperation = 'source-over';
  }

  // hp bar for big ones
  if((z.type==='brute'||z.type==='abomination') && z.hp<z.maxhp){
    var w = z.r*2.2, h = 4, x = z.x-w/2, y = z.y-z.r-14;
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(x-1,y-1,w+2,h+2);
    ctx.fillStyle = z.type==='abomination' ? '#ff4a2a' : '#d9822b';
    ctx.fillRect(x,y,w*clamp(z.hp/z.maxhp,0,1),h);
  }
}
function drawZombies(){
  for(var i=0;i<zombies.length;i++) drawZombie(zombies[i]);
}
function drawPlayer(){
  var p = player;
  var flick = (p.invuln>0 && Math.floor(G.t*20)%2===0) ? 0.5 : 1;
  ctx.save();
  ctx.globalAlpha = flick;
  ctx.translate(p.x,p.y);

  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.beginPath(); ctx.ellipse(2,4,p.r*1.15,p.r*0.9,0,0,TAU); ctx.fill();

  ctx.rotate(p.angle);

  // fuel tank
  ctx.fillStyle = '#2b3138';
  rr(-p.r*1.35, -p.r*0.62, p.r*0.72, p.r*1.24, 3);
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.6)';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // body
  ctx.fillStyle = '#3c4c5e';
  ctx.beginPath(); ctx.ellipse(0,0,p.r,p.r*0.9,0,0,TAU); ctx.fill();
  ctx.strokeStyle = '#1d232b';
  ctx.lineWidth = 2;
  ctx.stroke();

  // shoulder pads
  ctx.fillStyle = '#2e3a46';
  ctx.beginPath(); ctx.arc(0,-p.r*0.85,p.r*0.38,0,TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(0, p.r*0.85,p.r*0.38,0,TAU); ctx.fill();

  // head + helmet
  ctx.fillStyle = '#c79a70';
  ctx.beginPath(); ctx.arc(p.r*0.12,0,p.r*0.52,0,TAU); ctx.fill();
  ctx.fillStyle = '#22282f';
  ctx.beginPath(); ctx.arc(p.r*0.06,0,p.r*0.56,Math.PI*0.62,Math.PI*1.38,true); ctx.fill();

  // nozzle
  var nz = p.r+16;
  ctx.fillStyle = '#20242a';
  rr(p.r*0.6,-3.4, nz-p.r*0.6, 6.8, 3);
  ctx.fill();
  ctx.fillStyle = '#4a525c';
  rr(p.r*0.6,-3.4, (nz-p.r*0.6)*0.5, 6.8, 3);
  ctx.fill();

  // pilot flame / muzzle
  if(p.firing || p.muzzle>0){
    var mf = 0.7+Math.sin(G.t*45)*0.3;
    ctx.globalCompositeOperation = 'lighter';
    drawSprite(SPR.flame0, nz+8, 0, (26+rand(-4,6))*mf, 0.85);
    ctx.globalCompositeOperation = 'source-over';
  }
  ctx.restore();

  // aim guide
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  drawSprite(SPR.glowWarm, p.x+Math.cos(p.angle)*54, p.y+Math.sin(p.angle)*54, 46, p.firing?0.16:0.06);
  ctx.restore();
  ctx.globalAlpha = 1;
}
function drawPickups(){
  for(var i=0;i<pickups.length;i++){
    var p = pickups[i];
    var blink = p.life>p.max-4 ? (Math.floor(G.t*10)%2===0?0.25:1) : 1;
    var bob = Math.sin(p.bob)*3;
    ctx.globalAlpha = blink;
    ctx.globalCompositeOperation = 'lighter';
    drawSprite(SPR.pick, p.x, p.y+bob, 54, 0.5);
    ctx.globalCompositeOperation = 'source-over';
    if(p.type==='heart'){
      ctx.fillStyle = '#ff4d5e';
      ctx.beginPath();
      var s = 7, y = p.y+bob;
      ctx.moveTo(p.x, y+s*0.9);
      ctx.bezierCurveTo(p.x-s*1.6, y-s*0.3, p.x-s*0.6, y-s*1.4, p.x, y-s*0.5);
      ctx.bezierCurveTo(p.x+s*0.6, y-s*1.4, p.x+s*1.6, y-s*0.3, p.x, y+s*0.9);
      ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 1.4; ctx.stroke();
    } else if(p.type==='fuel'){
      ctx.fillStyle = '#54c8ff';
      rr(p.x-6, p.y-8+bob, 12, 16, 3); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 1.4; ctx.stroke();
      ctx.fillStyle = '#dff4ff';
      ctx.fillRect(p.x-2, p.y-11+bob, 4, 3);
    } else {
      ctx.save();
      ctx.translate(p.x, p.y+bob);
      ctx.rotate(G.t*1.4);
      ctx.fillStyle = '#ffbe4a';
      ctx.beginPath();
      ctx.moveTo(0,-8); ctx.lineTo(6,0); ctx.lineTo(0,8); ctx.lineTo(-6,0);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(120,50,0,0.7)'; ctx.lineWidth = 1.4; ctx.stroke();
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }
}
function drawFlamesLayer(){
  ctx.globalCompositeOperation = 'lighter';
  for(var i=0;i<flames.length;i++){
    var f = flames[i];
    var k = f.life/f.max;
    var idx = Math.min(FLAME_SPR.length-1, Math.floor(k*FLAME_SPR.length));
    var size = f.size*(1+k*1.7);
    var alpha = (1-k)*0.85;
    drawSprite(FLAME_SPR[idx], f.x, f.y, size, alpha);
  }
  for(i=0;i<sparks.length;i++){
    var s = sparks[i];
    var sk = s.life/s.max;
    ctx.strokeStyle = s.color+(1-sk)*0.9+')';
    ctx.lineWidth = s.size*(1-sk*0.5);
    ctx.beginPath();
    ctx.moveTo(s.x,s.y);
    ctx.lineTo(s.x-s.vx*0.03, s.y-s.vy*0.03);
    ctx.stroke();
  }
  for(i=0;i<flashes.length;i++){
    var fl = flashes[i];
    var fk = fl.life/fl.max;
    drawSprite(SPR.glowWarm, fl.x, fl.y, fl.r*(0.8+fk*0.9), (1-fk)*0.55);
  }
  for(i=0;i<embers.length;i++){
    var e = embers[i];
    var ek = e.life/e.max;
    drawSprite(SPR.spark, e.x, e.y, e.size*8, (1-ek)*0.5);
  }
  // burning zombie core glows (drawn over bodies for hot look)
  for(i=0;i<zombies.length;i++){
    var z = zombies[i];
    if(z.burning>0){
      drawSprite(SPR.flame0, z.x+rand(-4,4), z.y+rand(-4,4), z.r*1.5, 0.5);
    }
  }
  ctx.globalCompositeOperation = 'source-over';
}
function drawSmokeAshLayer(){
  for(var i=0;i<smokes.length;i++){
    var m = smokes[i];
    var k = m.life/m.max;
    drawSprite(SPR.smoke, m.x, m.y, m.size*(1+k*1.6), (1-k)*0.5);
  }
  for(i=0;i<ash.length;i++){
    var a = ash[i];
    var ak = a.life/a.max;
    ctx.globalAlpha = (1-ak)*0.8;
    ctx.fillStyle = a.g>0.5?'rgba(120,116,112,1)':'rgba(52,50,48,1)';
    ctx.beginPath();
    ctx.arc(a.x,a.y,a.size*(0.8+ak*0.6),0,TAU);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}
function drawRingsLayer(){
  ctx.globalCompositeOperation = 'lighter';
  for(var i=0;i<rings.length;i++){
    var r = rings[i];
    var k = r.life/r.max;
    ctx.strokeStyle = 'rgba(255,196,110,'+((1-k)*0.85)+')';
    ctx.lineWidth = 30*(1-k)+6;
    ctx.beginPath(); ctx.arc(r.x,r.y,r.r,0,TAU); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,240,200,'+((1-k)*0.8)+')';
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(r.x,r.y,r.r,0,TAU); ctx.stroke();
  }
  ctx.globalCompositeOperation = 'source-over';
}
function drawMeteorsLayer(){
  for(var i=0;i<meteors.length;i++){
    var m = meteors[i];
    var k = 1-m.t/m.max;
    // reticle
    ctx.strokeStyle = 'rgba(255,120,60,'+(0.45+Math.sin(G.t*14)*0.2)+')';
    ctx.lineWidth = 2;
    ctx.setLineDash([10,8]);
    ctx.beginPath(); ctx.arc(m.x,m.y,130,0,TAU); ctx.stroke();
    ctx.setLineDash([]);
    ctx.strokeStyle = 'rgba(255,190,120,0.7)';
    ctx.beginPath(); ctx.arc(m.x,m.y,130*(1-k),0,TAU); ctx.stroke();
    // falling rock
    var fy = m.y-260*(1-k)+Math.sin(G.t*40)*2;
    ctx.globalCompositeOperation = 'lighter';
    drawSprite(SPR.glowWarm, m.x, fy-14, 130*(0.4+k), 0.6);
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#3a2b22';
    ctx.beginPath(); ctx.arc(m.x, fy, 16+k*8, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ff8c33';
    ctx.beginPath(); ctx.arc(m.x-4, fy-4, 5+k*4, 0, TAU); ctx.fill();
  }
}
function drawTextsLayer(){
  for(var i=0;i<texts.length;i++){
    var t = texts[i];
    var k = t.life/t.max;
    dtext(t.str, t.x, t.y, { size:t.size, color:t.color, alpha:1-k*k, outline:3 });

}

// ---------- HUD ----------
function abilityIcon(x,y,size,key,label,cd,cdMax,readyColor){
  ctx.save();
  ctx.fillStyle = 'rgba(10,12,16,0.72)';
  rr(x,y,size,size,8); ctx.fill();
  ctx.strokeStyle = cd>0 ? 'rgba(255,140,50,0.22)' : 'rgba(255,150,60,0.85)';
  ctx.lineWidth = 2;
  rr(x,y,size,size,8); ctx.stroke();

  if(cd>0){
    var k = cd/cdMax;
    ctx.save();
    rr(x+1,y+1,size-2,size-2,7); ctx.clip();
    ctx.fillStyle = 'rgba(0,0,0,0.62)';
    ctx.fillRect(x,y,size,size*k);
    ctx.restore();
    dtext(cd.toFixed(cd<1?1:0), x+size/2, y+size/2+1, { size:size*0.34, color:'#ffb56a', outline:2 });
  } else {
    ctx.globalCompositeOperation = 'lighter';
    drawSprite(SPR.pick, x+size/2, y+size/2, size*1.1, 0.25);
    ctx.globalCompositeOperation = 'source-over';
  }
  dtext(key, x+size/2, y+11, { size:size*0.22, color:'#ffd9a8', outline:2 });
  dtext(label, x+size/2, y+size-10, { size:size*0.19, color:cd>0?'#8c99a5':'#ffe9c8', outline:2 });
  ctx.restore();
}
function drawHUD(){
  var pad = 18;
  ctx.save();

  // HP
  var bw = Math.min(240, W*0.32), bh = 15;
  var hp = clamp(player.hp/player.maxHp,0,1);
  dtext('HP', pad+2, pad+6, { size:12, align:'left', color:'#c7d3de', outline:2 });
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  rr(pad, pad+14, bw, bh, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.14)';
  ctx.lineWidth = 1.5;
  rr(pad, pad+14, bw, bh, 7); ctx.stroke();
  var hg = ctx.createLinearGradient(pad,0,pad+bw,0);
  hg.addColorStop(0,'#ff5a2a');
  hg.addColorStop(1,'#ffc76a');
  ctx.save();
  rr(pad+1, pad+15, (bw-2)*hp, bh-2, 6); ctx.clip();
  ctx.fillStyle = hg;
  ctx.fillRect(pad+1, pad+15, bw, bh);
  ctx.restore();
  ctx.fillStyle = 'rgba(255,255,255,'+(hp<0.3?(0.25+Math.sin(G.t*10)*0.2):0.08)+')';
  rr(pad+1, pad+15, bw-2, bh-2, 6); ctx.fill();

  // heat
  var hy = pad+18+bh;
  var hw = bw*0.7, hh = 7;
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  rr(pad, hy, hw, hh, 4); ctx.fill();
  var hcol = player.overheat ? 'rgba(255,60,40,0.95)' : 'rgba(255,190,90,0.9)';
  if(player.overheat && Math.floor(G.t*8)%2===0) hcol = 'rgba(255,150,60,0.95)';
  ctx.fillStyle = hcol;
  rr(pad, hy, Math.max(2,hw*player.heat), hh, 4); ctx.fill();
  dtext(player.overheat?'OVERHEAT':'HEAT', pad+hw+8, hy+hh/2, { size:10, align:'left', color:player.overheat?'#ff7a58':'#9aa7b2', outline:2 });

  // score
  dtext('SCORE', W-pad, pad+6, { size:12, align:'right', color:'#c7d3de', outline:2 });
  dtext(String(G.score), W-pad, pad+30, { size:30, align:'right', color:'#ffe9b0', outline:4, shadow:8 });
  if(G.combo>1){
    var mult = (1+Math.min(G.combo,40)*0.05);
    dtext('x'+mult.toFixed(2)+'  ('+G.combo+' combo)', W-pad, pad+52, { size:13, align:'right', color:'#ffb056', outline:3 });
    ctx.fillStyle = 'rgba(255,176,86,0.7)';
    ctx.fillRect(W-pad-120, pad+60, 120*clamp(G.comboT/2.6,0,1), 3);
  }

  // wave
  var alive = zombies.length + G.toSpawn;
  dtext('WAVE '+Math.max(1,G.wave), W/2, pad+10, { size:22, color:'#ffd9a8', outline:4, shadow:10 });
  if(G.betweenWaves>0) dtext('NEXT WAVE IN '+G.betweenWaves.toFixed(1), W/2, pad+32, { size:13, color:'#9fb6c8', outline:3 });
  else dtext(alive+' LEFT', W/2, pad+32, { size:13, color:'#9fb6c8', outline:3 });
  dtext('BEST '+G.best, W/2, pad+50, { size:11, color:'#6d7c89', outline:2 });

  // abilities
  var s = 58, gap = 10;
  var ax = pad, ay = H-pad-s;
  abilityIcon(ax, ay, s, 'SHIFT', 'DASH', player.dashCd, DASH_CD);
  abilityIcon(ax+s+gap, ay, s, 'Q', 'NOVA', player.novaCd, NOVA_CD);
  abilityIcon(ax+2*(s+gap), ay, s, 'E', 'METEOR', player.meteorCd, METEOR_CD);

  // hint
  if(G.wave===1 && G.t<G.hintT){
    var ha = clamp(Math.min(G.t, G.hintT-G.t),0,1)*0.85;
    dtext('WASD MOVE   ·   HOLD MOUSE TO BURN   ·   SHIFT DASH   ·   Q NOVA   ·   E METEOR', W/2, H-26, { size:13, color:'#cfe0ee', outline:3, alpha:ha });
  }
  ctx.restore();
}
function drawCrosshair(){
  if(touch.active) return;
  var x = mouse.x, y = mouse.y;
  var firing = player.firing;
  var r = firing ? 13 : 10;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  drawSprite(SPR.pick, x, y, firing?46:26, firing?0.5:0.25);
  ctx.globalCompositeOperation = 'source-over';
  ctx.strokeStyle = 'rgba(255,220,170,0.9)';
  ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x-r-6,y); ctx.lineTo(x-r-1,y);
  ctx.moveTo(x+r+1,y); ctx.lineTo(x+r+6,y);
  ctx.moveTo(x,y-r-6); ctx.lineTo(x,y-r-1);
  ctx.moveTo(x,y+r+1); ctx.lineTo(x,y+r+6);
  ctx.stroke();
  ctx.fillStyle = 'rgba(255,240,210,0.95)';
  ctx.beginPath(); ctx.arc(x,y,1.8,0,TAU); ctx.fill();
  // heat ring
  if(player.heat>0.02){
    var hk = clamp(player.heat,0,1);
    ctx.strokeStyle = player.overheat ? 'rgba(255,70,40,0.95)' : 'rgba(255,180,80,0.9)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(x,y,r+7,-Math.PI/2,-Math.PI/2+TAU*hk);
    ctx.stroke();
  }
  if(player.overheat){
    dtext('OVERHEAT', x, y+r+24, { size:12, color:'#ff8a5e', outline:3 });
  }
  ctx.restore();
}
function drawMsg(){
  if(!G.msg) return;

  var k = m.t/m.dur;
  var a = k<0.12 ? k/0.12 : (k>0.75 ? (1-k)/0.25 : 1);

  ctx.restore();
}

function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);

  var ox = 0, oy = 0;
  if(shake.t>0){
    var k = shake.t/0.35;
    ox = (Math.random()-0.5)*2*shake.mag*k;
    oy = (Math.random()-0.5)*2*shake.mag*k;
  }
  ctx.save();
  ctx.translate(ox,oy);

  drawGround();
  drawDecals();
  drawPoolsLayer();
  drawZombies();
  drawPlayer();
  drawPickups();
  drawFlamesLayer();
  drawSmokeAshLayer();
  drawRingsLayer();
  drawMeteorsLayer();
  drawTextsLayer();

  ctx.restore();

  if(G.state==='playing' || G.state==='paused'){
    drawHUD();
  }

  if(G.flashT>0){
    ctx.fillStyle = 'rgba(255,30,10,'+(G.flashT/0.4*0.28)+')';
    ctx.fillRect(0,0,W,H);
  }

  if(G.state==='title') drawTitle();
  else if(G.state==='paused') drawPaused();
  else if(G.state==='gameover') drawGameOver();

  if(G.state==='playing') drawCrosshair();
  drawMsg();
}

// ---------- flow ----------
function resetRun(){
  zombies.length = 0; flames.length = 0; sparks.length = 0; ash.length = 0;
  smokes.length = 0; flashes.length = 0; pickups.length = 0; texts.length = 0;
  pools.length = 0; rings.length = 0; meteors.length = 0; decals.length = 0;
  var p = player;
  p.x = W/2; p.y = H/2;
  p.hp = p.maxHp = 100;
  p.vx = p.vy = p.kx = p.ky = 0;
  p.heat = 0; p.overheat = false;
  p.invuln = 0; p.dashCd = 0; p.dashT = 0; p.dashQueued = false;
  p.novaCd = 0; p.meteorCd = 0;
  p.firing = false; p.muzzle = 0;
  G.score = 0; G.kills = 0; G.combo = 0; G.comboT = 0;
  G.wave = 0; G.toSpawn = 0; G.spawnTimer = 0; G.betweenWaves = 0; G.bossQueued = false;
  G.msg = null; G.flashT = 0; G.overAt = 0;
  shake.t = 0; shake.mag = 0;
  flameAcc = 0; crackleT = 0; growlT = 2;
  mouse.down = false;
}
function startGame(){
  resetRun();
  G.state = 'playing';
  G.t = 0;
  G.hintT = 12;
  startWave(1);
  audioInit();
}
function gameOver(){
  if(G.state!=='playing') return;
  G.state = 'gameover';
  G.overAt = G.t;
  setFlameSound(false);
  var i;
  for(i=0;i<40;i++) addSparks(player.x,player.y,1,420);
  addAsh(player.x,player.y,40);
  addSmoke(player.x,player.y,16);
  addFlash(player.x,player.y,200);
  addShake(18,0.8);
  sfx.gameover();
  if(G.score>G.best){ G.best = G.score; try{ localStorage.setItem('infernodead.best', String(G.best)); }catch(e){} }
}
function setPaused(on){
  if(on && G.state==='playing'){ G.state = 'paused'; setFlameSound(false); }
  else if(!on && G.state==='paused'){ G.state = 'playing'; }
}
function onKeyPress(code){
  audioInit();
  if(code==='KeyM'){ toggleMute(); return; }
  if(G.state==='title'){
    if(code==='Space'||code==='Enter') startGame();
    return;
  }
  if(G.state==='playing'){
    if(code==='KeyP'||code==='Escape'){ setPaused(true); return; }
    if(code==='KeyQ'){ castNova(); return; }
    if(code==='KeyE'){ castMeteor(); return; }
    if(code==='ShiftLeft'||code==='ShiftRight'||code==='Space'){ player.dashQueued = true; return; }
    return;
  }
  if(G.state==='paused'){
    if(code==='KeyP'||code==='Escape') setPaused(false);
    return;
  }
  if(G.state==='gameover'){
    if(code==='KeyR'||code==='Space'||code==='Enter'){ if(G.t-G.overAt>0.5) startGame(); }
  }
}

// ---------- input ----------
window.addEventListener('keydown', function(e){
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='ArrowDown'||e.code==='ArrowLeft'||e.code==='ArrowRight') e.preventDefault();
  if(!keys[e.code]) onKeyPress(e.code);
  keys[e.code] = true;
});
window.addEventListener('keyup', function(e){ keys[e.code] = false; });
window.addEventListener('blur', function(){ if(G.state==='playing') setPaused(true); });
canvas.addEventListener('mousemove', function(e){ mouse.x = e.clientX; mouse.y = e.clientY; });
canvas.addEventListener('mousedown', function(e){
  audioInit();
  mouse.x = e.clientX; mouse.y = e.clientY;
  if(e.button===0){
    if(G.state==='title'){ startGame(); return; }
    if(G.state==='gameover'){ if(G.t-G.overAt>0.5) startGame(); return; }
    mouse.down = true;
  } else if(e.button===2){
    if(G.state==='playing') castNova();
  }
});
window.addEventListener('mouseup', function(e){ if(e.button===0) mouse.down = false; });
canvas.addEventListener('contextmenu', function(e){ e.preventDefault(); });
canvas.addEventListener('touchstart', function(e){
  e.preventDefault();
  audioInit();
  var t0 = e.touches[0];
  touch.active = true; touch.x = t0.clientX; touch.y = t0.clientY; touch.n = e.touches.length;
  if(G.state==='title'){ startGame(); return; }
  if(G.state==='gameover'){ if(G.t-G.overAt>0.5) startGame(); return; }
  if(e.touches.length>=2) castNova();
  if(e.touches.length>=3) castMeteor();
}, {passive:false});
canvas.addEventListener('touchmove', function(e){
  e.preventDefault();
  var t0 = e.touches[0];
  touch.x = t0.clientX; touch.y = t0.clientY;
}, {passive:false});
canvas.addEventListener('touchend', function(e){
  e.preventDefault();
  if(e.touches.length===0) touch.active = false;
}, {passive:false});

// ---------- boot ----------
function init(){
  try{ G.best = parseInt(localStorage.getItem('infernodead.best')||'0',10)||0; }catch(e){ G.best = 0; }
  try{ muted = localStorage.getItem('infernodead.muted')==='1'; }catch(e){ muted = false; }
  mouse.x = window.innerWidth/2;
  mouse.y = window.innerHeight/2;
  resize();
  requestAnimationFrame(frame);
}

var last = 0;
function frame(ts){
  requestAnimationFrame(frame);
  var t = ts/1000;
  var dt = last ? t-last : 1/60;
  last = t;
  if(dt>0.05) dt = 0.05;
  if(dt<0) dt = 0;
  update(dt);
  render();
}

init();

})();
</script>
