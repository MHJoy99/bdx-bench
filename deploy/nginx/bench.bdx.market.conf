# bench.bdx.market - BDX Bench prod (second drive /srv/bot-storage/sites/bench.bdx.market)
server {
    server_name bench.bdx.market;
    access_log /var/log/nginx/bench.bdx.market.access.log;
    error_log /var/log/nginx/bench.bdx.market.error.log;
    client_max_body_size 1m;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location ^~ /api/ {
        limit_req zone=bench_api burst=10 nodelay;
        proxy_pass http://127.0.0.1:8766;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }
    location / {
        limit_req zone=bench_site burst=80 nodelay;
        proxy_pass http://127.0.0.1:8766;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/bench.bdx.market/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/bench.bdx.market/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = bench.bdx.market) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name bench.bdx.market;
    return 404; # managed by Certbot


}